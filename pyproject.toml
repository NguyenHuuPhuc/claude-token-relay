[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-token-relay"
version = "0.2.0"
description = "Put a long-lived Claude token from `claude setup-token` where it is needed (Paperclip first), never showing it."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
claude-token-relay = "claude_token_relay.cli:main"
ctrelay = "claude_token_relay.cli:main"

[tool.setuptools]
packages = ["claude_token_relay", "claude_token_relay.targets"]
